<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ title }} - 選擇相片</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="header">
        <h2>{{ title }} {% if is_group %}(群組/班級相片){% else %}(學生個人相片){% endif %}</h2>
    </div>

    <div class="container">
        {% if photos %}
        <form action="/cart/checkout" method="POST">
            <input type="hidden" name="album_id" value="{{ album_id }}">
            
            <div style="margin-bottom: 12px; font-weight: bold; color: #555;">請勾選您想要訂購的相片：</div>
            
            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 80px;">
                {% for photo in photos %}
                <div class="photo-card" style="margin-bottom: 0;">
                    <img src="{{ photo.watermarked_url }}" alt="{{ photo.filename }}" loading="lazy">
                    <div style="padding: 10px; text-align: center; background: #fff;">
                        <label style="cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: bold;">
                            <input type="checkbox" name="selected_photos" value="{{ photo.filename }}" style="transform: scale(1.3); accent-color: #2c3e50;">
                            <span>{{ photo.filename }}</span>
                        </label>
                    </div>
                </div>
                {% endfor %}
            </div>

            <div class="cart-bar">
                <button type="submit" class="checkout-btn" style="width: 100%; justify-content: center; background: #2c3e50;">
                    下一步：選擇相片規格 ➔
                </button>
            </div>
        </form>
        {% else %}
            <div class="empty-state">📸 目前還沒有相片上傳喔！</div>
        {% endif %}
    </div>
</body>
</html>
