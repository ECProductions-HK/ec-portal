<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ title }} - 選擇相片</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        /* 手機最佳化網格排版：一排兩張縮圖 */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 90px;
        }
        .photo-thumb-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            border: 2px solid #e9ecef;
            transition: all 0.2s;
            cursor: pointer;
        }
        .photo-thumb-card.selected {
            border-color: #2c3e50;
            background-color: #f8f9fa;
        }
        .photo-thumb-card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            display: block;
        }
        .thumb-footer {
            padding: 8px;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>{{ title }} {% if is_group %}(群組/班級相片){% else %}(學生個人相片){% endif %}</h2>
    </div>

    <div class="container" style="padding: 10px;">
        {% if photos %}
        <form action="/cart/checkout" method="POST" id="selection-form">
            <input type="hidden" name="album_id" value="{{ album_id }}">
            
            <div style="margin: 8px 0 12px 4px; font-weight: bold; color: #555; font-size: 14px;">
                👆 請點選您想要訂購的相片（可多選）：
            </div>
            
            <div class="photo-grid">
                {% for photo in photos %}
                <div class="photo-thumb-card" id="card_{{ loop.index0 }}" onclick="toggleCard('{{ loop.index0 }}')">
                    <img src="{{ photo.watermarked_url }}" alt="{{ photo.filename }}" loading="lazy">
                    <div class="thumb-footer">
                        <input type="checkbox" name="selected_photos" value="{{ photo.filename }}" id="chk_{{ loop.index0 }}" style="transform: scale(1.2); accent-color: #2c3e50;" onclick="event.stopPropagation(); updateCardStyle('{{ loop.index0 }}')">
                        <span>{{ photo.filename }}</span>
                    </div>
                </div>
                {% endfor %}
            </div>

            <div class="cart-bar">
                <button type="submit" class="checkout-btn" id="next-btn" style="width: 100%; justify-content: center; background: #2c3e50;" disabled>
                    請先選擇相片 ➔
                </button>
            </div>
        </form>
        {% else %}
            <div class="empty-state">📸 目前還沒有相片上傳喔！</div>
        {% endif %}
    </div>

    <script>
        function toggleCard(index) {
            const chk = document.getElementById(`chk_${index}`);
            chk.checked = !chk.checked;
            updateCardStyle(index);
        }

        function updateCardStyle(index) {
            const chk = document.getElementById(`chk_${index}`);
            const card = document.getElementById(`card_${index}`);
            
            if (chk.checked) {
                card.classList.add('selected');
            } else {
                card.classList.remove('selected');
            }
            checkSelection();
        }

        function checkSelection() {
            const checkedBoxes = document.querySelectorAll('input[name="selected_photos"]:checked');
            const btn = document.getElementById('next-btn');
            
            if (checkedBoxes.length > 0) {
                btn.disabled = false;
                btn.style.background = '#25D366';
                btn.innerText = `下一步：為選中的 ${checkedBoxes.length} 張相片選擇規格 ➔`;
            } else {
                btn.disabled = true;
                btn.style.background = '#2c3e50';
                btn.innerText = '請先選擇相片 ➔';
            }
        }
    </script>
</body>
</html>
