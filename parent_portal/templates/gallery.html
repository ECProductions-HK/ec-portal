<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>我的相簿 · EC Productions</title>
  <link rel="stylesheet" href="/static/style.css"/>
</head>
<body>
  <header class="bar">
    <div>
      <p class="brand">EC Productions</p>
      <h1>{{ student_title }} 的相簿</h1>
    </div>
    <form method="post" action="/logout"><button type="submit">登出</button></form>
  </header>
  <section class="grid">
    {% for a in albums %}
    <a class="card" href="/gallery/{{ a.id }}">
      {% if a.cover %}
      <img src="{{ a.cover }}" alt=""/>
      {% else %}
      <div class="empty">未有相片</div>
      {% endif %}
      <div class="info">
        <strong>{{ a.title }}</strong>
        <span>{{ "團體／活動相" if a.is_group else "個人專屬相" }} · {{ a.count }} 張</span>
      </div>
    </a>
    {% endfor %}
  </section>
  <p class="footnote">提示：畫面顯示為防盜浮水印預覽圖。選定並確認後將提供原圖下載。</p>
</body>
</html>
