<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ title }} - 相片選購</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="header">
        <h2>{{ title }} {% if is_group %}(群組/班級相片){% else %}(學生個人相片){% endif %}</h2>
    </div>

    <div class="container">
        {% if photos %}
        <form action="/cart/checkout" method="POST" id="order-form">
            <input type="hidden" name="album_id" value="{{ album_id }}">
            
            {% for photo in photos %}
            <div class="photo-card">
                <img src="{{ photo.watermarked_url }}" alt="{{ photo.filename }}" loading="lazy">
                <div class="photo-info">
                    <div class="photo-title">檔案：{{ photo.filename }}</div>
                    
                    <!-- 隱藏欄位記錄這張照片勾選了哪些規格 -->
                    <input type="hidden" name="selected_photos" value="{{ photo.filename }}">

                    <!-- 依照您提供的真實 Excel 價格選項 -->
                    <label class="option-label" id="label_{{ loop.index }}_1">
                        <div><input type="checkbox" name="item_data" value="{{ photo.filename }}|5R過膠" onchange="toggleOption(this, 'label_{{ loop.index }}_1', 7)"> 5R 過膠</div>
                        <div class="price-tag">$7</div>
                    </label>
                    
                    <label class="option-label" id="label_{{ loop.index }}_2">
                        <div><input type="checkbox" name="item_data" value="{{ photo.filename }}|5R過膠連框裱" onchange="toggleOption(this, 'label_{{ loop.index }}_2', 10)"> 5R 過膠連框裱</div>
                        <div class="price-tag">$10</div>
                    </label>
                    
                    <label class="option-label" id="label_{{ loop.index }}_3">
                        <div><input type="checkbox" name="item_data" value="{{ photo.filename }}|8R過膠" onchange="toggleOption(this, 'label_{{ loop.index }}_3', 13)"> 8R 過膠</div>
                        <div class="price-tag">$13</div>
                    </label>
                    
                    <label class="option-label" id="label_{{ loop.index }}_4">
                        <div><input type="checkbox" name="item_data" value="{{ photo.filename }}|8R過膠連框裱" onchange="toggleOption(this, 'label_{{ loop.index }}_4', 15)"> 8R 過膠連框裱</div>
                        <div class="price-tag">$15</div>
                    </label>
                </div>
            </div>
            {% endfor %}

            <div class="cart-bar">
                <div>
                    <div style="font-size: 12px; color: #666;">總計金額</div>
                    <div class="total-price" id="cart-total">$0</div>
                </div>
                <button type="submit" class="checkout-btn" id="checkout-btn" disabled>
                    📲 前往結帳
                </button>
            </div>
        </form>
        {% else %}
            <div class="empty-state">📸 目前還沒有相片上傳喔！</div>
        {% endif %}
    </div>

    <script>
        let totalPrice = 0;
        let selectedCount = 0;

        function toggleOption(checkbox, labelId, price) {
            const labelEl = document.getElementById(labelId);
            if (checkbox.checked) {
                totalPrice += price;
                selectedCount += 1;
                if (labelEl) labelEl.classList.add('selected');
            } else {
                totalPrice -= price;
                selectedCount -= 1;
                if (labelEl) labelEl.classList.remove('selected');
            }

            document.getElementById('cart-total').innerText = `$${totalPrice}`;
            document.getElementById('checkout-btn').disabled = selectedCount === 0;
        }
    </script>
</body>
</html>
