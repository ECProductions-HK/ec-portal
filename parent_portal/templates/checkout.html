<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ student_title }} - 選擇相片規格與數量</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .qty-row { display: flex; justify-content: space-between; align-items: center; background: #f8f9fa; padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #e9ecef; }
        .qty-select { padding: 6px 10px; font-size: 15px; border-radius: 6px; border: 1px solid #ccc; background: white; }
    </style>
</head>
<body>

    <div class="header">
        <h2>{{ student_title }} - 選擇規格與數量</h2>
    </div>

    <div class="container" style="padding-bottom: 130px;">
        <form action="/order/submit" method="POST" enctype="multipart/form-data" id="order-form">
            <input type="hidden" name="album_id" value="{{ album_id }}">

            <!-- 動態隱藏輸入框會在這裡生成並傳給後端 -->
            <div id="hidden-inputs-container"></div>

            {% for photo in selected_photos %}
            <div class="photo-card" style="padding: 15px; margin-bottom: 20px;">
                <div class="photo-title">檔案：{{ photo }}</div>
                
                <div style="display: flex; flex-direction: column;">
                    <div class="qty-row">
                        <div><strong>5R 過膠</strong> <span style="color: #e53935; font-weight: bold;">($7)</span></div>
                        <select class="qty-select" data-photo="{{ photo }}" data-opt="5r_lam" data-price="7" onchange="recalculate()">
                            <option value="0" selected>0 張</option>
                            <option value="1">1 張</option>
                            <option value="2">2 張</option>
                            <option value="3">3 張</option>
                            <option value="4">4 張</option>
                            <option value="5">5 張</option>
                        </select>
                    </div>
                    
                    <div class="qty-row">
                        <div><strong>5R 過膠連框裱</strong> <span style="color: #e53935; font-weight: bold;">($10)</span></div>
                        <select class="qty-select" data-photo="{{ photo }}" data-opt="5r_frame" data-price="10" onchange="recalculate()">
                            <option value="0" selected>0 張</option>
                            <option value="1">1 張</option>
                            <option value="2">2 張</option>
                            <option value="3">3 張</option>
                            <option value="4">4 張</option>
                            <option value="5">5 張</option>
                        </select>
                    </div>
                    
                    <div class="qty-row">
                        <div><strong>8R 過膠</strong> <span style="color: #e53935; font-weight: bold;">($13)</span></div>
                        <select class="qty-select" data-photo="{{ photo }}" data-opt="8r_lam" data-price="13" onchange="recalculate()">
                            <option value="0" selected>0 張</option>
                            <option value="1">1 張</option>
                            <option value="2">2 張</option>
                            <option value="3">3 張</option>
                            <option value="4">4 張</option>
                            <option value="5">5 張</option>
                        </select>
                    </div>
                    
                    <div class="qty-row">
                        <div><strong>8R 過膠連框裱</strong> <span style="color: #e53935; font-weight: bold;">($15)</span></div>
                        <select class="qty-select" data-photo="{{ photo }}" data-opt="8r_frame" data-price="15" onchange="recalculate()">
                            <option value="0" selected>0 張</option>
                            <option value="1">1 張</option>
                            <option value="2">2 張</option>
                            <option value="3">3 張</option>
                            <option value="4">4 張</option>
                            <option value="5">5 張</option>
                        </select>
                    </div>
                </div>
            </div>
            {% endfor %}

            <div style="background: white; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px;">
                <h3 style="margin-top: 0; font-size: 16px; color: #2c3e50;">聯絡與付款</h3>
                <div style="margin-bottom: 12px;">
                    <label style="display: block; font-size: 14px; margin-bottom: 6px; font-weight: bold;">WhatsApp 聯絡電話：</label>
                    <input type="text" name="contact_phone" required placeholder="例如: 91234567" style="width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 8px; font-size: 16px;">
                </div>
                <div>
                    <label style="display: block; font-size: 14px; margin-bottom: 6px; font-weight: bold;">上傳轉帳收據截圖：</label>
                    <input type="file" name="receipt" required accept="image/*" style="width: 100%; padding: 6px 0;">
                </div>
            </div>

            <div class="cart-bar">
                <div>
                    <div style="font-size: 12px; color: #666;">總計金額</div>
                    <div class="total-price" id="grand-total">$0</div>
                </div>
                <button type="submit" class="checkout-btn" id="submit-btn" style="background: #25D366;" disabled>
                    📲 提交訂單
                </button>
            </div>
        </form>
    </div>

    <script>
        function recalculate() {
            const selects = document.querySelectorAll('.qty-select');
            let total = 0;
            const container = document.getElementById('hidden-inputs-container');
            container.innerHTML = ''; // 清空舊的隱藏欄位

            selects.forEach(sel => {
                const qty = parseInt(sel.value);
                if (qty > 0) {
                    const photo = sel.getAttribute('data-photo');
                    const opt = sel.getAttribute('data-opt');
                    const price = parseInt(sel.getAttribute('data-price'));
                    
                    total += price * qty;

                    const input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = 'item_data';
                    input.value = `${photo}|${opt}|${qty}`;
                    container.appendChild(input);
                }
            });

            document.getElementById('grand-total').innerText = '$' + total;
            
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = (total === 0);
            if (submitBtn.disabled) {
                submitBtn.style.background = '#ccc';
            } else {
                submitBtn.style.background = '#25D366';
            }
        }

        recalculate();
    </script>
</body>
</html>
