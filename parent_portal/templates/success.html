<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>訂單已提交 · EC Productions</title>
  <link rel="stylesheet" href="/static/style.css"/>
  <style>
    .success-box {
      max-width: 500px;
      margin: 40px auto;
      padding: 30px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      text-align: center;
    }
    .success-icon {
      font-size: 48px;
      color: #10b981;
      margin-bottom: 16px;
    }
    .btn-whatsapp {
      display: inline-block;
      background-color: #25D366;
      color: white;
      font-weight: bold;
      padding: 14px 24px;
      border-radius: 50px;
      text-decoration: none;
      margin-top: 20px;
      box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
      transition: background 0.2s;
    }
    .btn-whatsapp:hover {
      background-color: #20ba5a;
    }
  </style>
</head>
<body style="background: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <div class="success-box">
    <div class="success-icon">✅</div>
    <h2>訂單已成功送出！</h2>
    <p style="color: #4b5563; margin-top: 8px;">
      我們已成功記錄 <strong>{{ student_title }}</strong> 的選相訂單與轉帳收據（總計 HK${{ total_amount }}）。
    </p>
    
    <div style="background: #f1f5f9; padding: 16px; border-radius: 12px; margin: 20px 0; text-align: left; font-size: 14px; color: #334155;">
      <p style="margin: 0 0 8px 0; font-weight: bold;">💡 下一步：</p>
      <p style="margin: 0;">請點擊下方按鈕，將訂單明細一鍵發送至公司的 WhatsApp，以便同事能極速為您核對款項並安排印刷發貨！</p>
    </div>

    <!-- 一鍵 WhatsApp 按鈕 -->
    <a id="wa-link" href="#" class="btn-whatsapp" target="_blank">
      📲 一鍵發送訂單至 WhatsApp
    </a>

    <div style="margin-top: 24px;">
      <a href="/gallery" style="color: #2563eb; text-decoration: none; font-size: 14px;">← 返回相簿</a>
    </div>
  </div>

  <script>
    // 自動將後端傳來的訂單明細編碼並組合成 WhatsApp 連結
    const phone = "{{ ops_whatsapp }}";
    const text = `{{ whatsapp_message }}`;
    const encodedText = encodeURIComponent(text);
    document.getElementById('wa-link').href = `https://wa.me/${phone}?text=${encodedText}`;
  </script>
</body>
</html>
