<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{{ student_title }} 的相簿 · EC Productions</title>
  <link rel="stylesheet" href="/static/style.css"/>
</head>
<body>
  <header class="bar">
    <h1>{{ student_title }} 的相簿</h1>
    <form action="/logout" method="post"><button type="submit" class="btn-link">登出</button></form>
  </header>
  <main class="container" style="max-width: 1100px;">
    <div class="grid">
      {% for a in albums %}
      <a href="/gallery/{{ a.id }}" class="card album-card">
        {% if a.cover %}
        <img src="{{ a.cover }}" alt="{{ a.title }}" loading="lazy"/>
        {% else %}
        <div style="aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; background:#eaecf0;" class="muted">無相片</div>
        {% endif %}
        <div class="album-info">
          <h2>{{ a.title }}</h2>
          <p class="muted">{{ a.count }} 張相片 (點擊進入選相)</p>
        </div>
      </a>
      {% endfor %}
    </div>
  </main>
</body>
</html>
